<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>给元元❤</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><path fill='%23FF5C8A' d='M12 21s-7-4.6-9.3-9C1 8 3 4.5 6.5 4.5 9 4.5 12 7 12 7s3-2.5 5.5-2.5C21 4.5 23 8 21.3 12 19 16.4 12 21 12 21z'/></svg>">
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=ZCOOL+KuaiLe&display=swap&family=Ma+Shan+Zheng&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/zcool-kuaile@5.1.0/index.css">
<style>
  :root {
    --pink: #FF5C8A;
    --pink-soft: #FF9DB8;
    --bg1: #FFF0F5;
    --bg2: #FFDCE8;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: "ZCOOL KuaiLe", "Ma Shan Zheng", "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif;
    background: radial-gradient(120% 100% at 50% 0%, var(--bg1) 0%, var(--bg2) 100%);
    color: #5A2E43;
    overflow: hidden;
    -webkit-user-select: none;
    user-select: none;
  }
  canvas#scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }

  /* ============ 背景漂浮爱心（DOM，克制） ============ */
  #heartField { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 1; }
  #heartField i {
    position: absolute; bottom: -8vh; display: block;
    font-style: normal;
    opacity: 0; animation: floatUp linear infinite;
  }
  @keyframes floatUp {
    0% { transform: translateY(0) rotate(0deg); opacity: 0; }
    10% { opacity: .5; }
    90% { opacity: .35; }
    100% { transform: translateY(-115vh) rotate(28deg); opacity: 0; }
  }

  /* ============ 标题区 ============ */
  .head {
    position: fixed; top: 1.5vh; left: 0; right: 0; z-index: 3;
    text-align: center; pointer-events: none;
    padding: 0 120px;
    box-sizing: border-box;
    transition: opacity .6s ease, transform .6s ease;
  }
  .title {
    font-family: "ZCOOL KuaiLe", "PingFang SC", "Microsoft YaHei", sans-serif;
    font-size: clamp(34px, 6.5vw, 64px);
    font-weight: 400; line-height: 1.1; letter-spacing: 2px;
    background: linear-gradient(180deg, #FF8FB1 0%, #FF5C8A 55%, #FF9E64 100%);
    -webkit-background-clip: text; background-clip: text;
    color: transparent;
    filter: drop-shadow(0 2px 0 rgba(255,255,255,.7));
  }
  .sub {
    margin-top: .6em;
    font-family: "Ma Shan Zheng", "ZCOOL KuaiLe", "KaiTi", "STKaiti", serif;
    font-size: clamp(17px, 2.6vw, 24px);
    color: #B8506E;
    text-shadow: 0 1px 0 rgba(255,255,255,.8);
  }

  /* ============ 音乐开关（右上角） ============ */
  .music-switch {
    position: fixed; top: calc(env(safe-area-inset-top, 0px) + 14px); right: 14px; z-index: 6;
    display: flex; align-items: center; gap: 6px;
    min-height: 44px; padding: 0 14px;
    border: 1.5px solid rgba(255, 92, 138, .35);
    border-radius: 999px;
    background: rgba(255, 255, 255, .85);
    color: #C25A7C; font-size: 13px; cursor: pointer;
    box-shadow: 0 4px 14px rgba(255, 92, 138, .16);
    transition: transform .15s ease, box-shadow .2s ease;
  }
  .music-switch:active { transform: scale(.94); }
  .music-switch svg { width: 16px; height: 16px; }
  .mute-hint {
    position: fixed; top: calc(env(safe-area-inset-top, 0px) + 74px); right: 14px; z-index: 6;
    font-size: 12px; color: #999; display: none; pointer-events: none;
  }

  /* ============ 开场（intro 期间只留 loader / 倒计时数字） ============ */
  body.intro .head, body.intro .music-switch, body.intro .credit { opacity: 0; pointer-events: none; transform: translateY(-8px); }

  :focus-visible { outline: 2px solid #FF5C8A; outline-offset: 3px; }
  .loader { outline: none !important; }
  .loader {
    position: fixed; left: 50%; top: 50%; z-index: 8;
    transform: translate(-50%, -50%);
    display: flex; flex-direction: column; align-items: center; gap: 20px;
    opacity: 0; pointer-events: none;
    transition: opacity .5s ease;
  }
  body.ready .loader { opacity: 1; pointer-events: auto; }
  .loader.gone { opacity: 0 !important; pointer-events: none !important; }
  .paw {
    width: 168px; height: auto; display: block;
    cursor: pointer;
    filter: drop-shadow(0 12px 26px rgba(255, 110, 160, .45));
    animation: pawBeat 1.4s ease-in-out infinite;
    transition: transform .2s ease;
  }
  .paw:hover { transform: scale(1.07); }
  @keyframes pawBeat {
    0%, 100% { transform: scale(1) rotate(-2deg); }
    50% { transform: scale(1.08) rotate(2deg); }
  }
  .start-txt {
    font-family: "ZCOOL KuaiLe", "PingFang SC", sans-serif;
    font-size: 22px; color: #FF5C8A;
    letter-spacing: 2px;
    text-shadow: 0 1px 0 rgba(255,255,255,.9);
    animation: fadeBlink 2s ease-in-out infinite;
  }
  @keyframes fadeBlink { 0%, 100% { opacity: 1; } 50% { opacity: .55; } }

  /* ============ 倒计时 ============ */
  .countdown {
    position: fixed; inset: 0; z-index: 7;
    display: flex; align-items: center; justify-content: center;
    opacity: 0; pointer-events: none; transition: opacity .3s ease;
  }
  .countdown.show { opacity: 1; }
  .cd-num {
    font-family: "ZCOOL KuaiLe", "PingFang SC", sans-serif;
    font-size: clamp(120px, 30vw, 260px);
    line-height: 1; color: #FF5C8A;
    text-shadow: 0 4px 0 rgba(255, 255, 255, .7), 0 14px 40px rgba(255, 92, 138, .35);
  }
  .cd-num.pop { animation: numPop .72s cubic-bezier(.22, 1, .36, 1); }
  @keyframes numPop {
    0% { transform: scale(.2) translateY(0); opacity: 0; }
    35% { opacity: 1; }
    100% { transform: scale(1) translateY(-4px); opacity: 1; }
  }

  /* ============ 底部操作栏 ============ */
  .dock {
    position: fixed; left: 0; right: 0; bottom: calc(env(safe-area-inset-bottom, 0px) + 22px);
    z-index: 5; display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 10px 18px;
    padding: 0 16px;
    opacity: 0; transform: translateY(16px); pointer-events: none;
    transition: opacity .7s ease .15s, transform .7s ease .15s;
  }
  .dock.show { opacity: 1; transform: none; pointer-events: auto; }
  .tip {
    font-size: 13px; color: #C25A7C;
    text-shadow: 0 1px 0 rgba(255,255,255,.85);
  }
  .dock button {
    min-height: 44px; padding: 0 18px;
    display: inline-flex; align-items: center; gap: 7px;
    border: 1.5px solid rgba(255, 92, 138, .38);
    border-radius: 999px;
    background: rgba(255, 255, 255, .9);
    color: #D25A80; font-size: 14px;
    font-family: inherit; cursor: pointer;
    box-shadow: 0 4px 14px rgba(255, 92, 138, .14);
    transition: transform .15s ease, background .2s ease;
  }
  .dock button:active { transform: scale(.95); }
  .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: #7FCA7F; box-shadow: 0 0 0 0 rgba(127, 202, 127, .5);
    transition: background .2s ease;
  }
  .dot.on { animation: breath 1.6s ease-in-out infinite; }
  .dot.blow { background: #FF5C5C; animation: flash .12s linear 3; }
  @keyframes breath {
    0%, 100% { box-shadow: 0 0 0 0 rgba(127, 202, 127, .55); }
    50% { box-shadow: 0 0 0 5px rgba(127, 202, 127, 0); }
  }
  @keyframes flash { 0%, 100% { opacity: 1; } 50% { opacity: .25; } }
  .cnt { color: #B8506E; font-size: 14px; }
  .cnt b { color: #FF5C8A; font-size: 16px; }

  /* ============ 版权 ============ */
  .credit {
    position: fixed; right: 14px; bottom: calc(env(safe-area-inset-bottom, 0px) + 8px);
    z-index: 5; font-size: 11px; color: rgba(150, 100, 120, .8);
    transition: opacity .6s ease;
  }

  /* ============ 降级提示 ============ */
  #noWebgl {
    position: fixed; inset: 0; z-index: 20; display: none;
    align-items: center; justify-content: center;
    background: var(--bg2); color: #B8506E; font-size: 18px; text-align: center; padding: 30px;
  }
  @media (max-width: 480px) {
    .head { padding: 0 10px; top: 64px; }
    .title { font-size: clamp(26px, 6vw, 34px); }
    .sub { font-size: 15px; margin-top: .4em; }
    .tip { display: none; }
    .dock { gap: 8px; bottom: calc(env(safe-area-inset-bottom, 0px) + 14px); }
    .dock button { padding: 0 14px; font-size: 13px; }
  }
</style>
</head>

      camera = new THREE.PerspectiveCamera(38, window.innerWidth / window.innerHeight, 0.1, 60);
      camera.position.set(3.95, 4.8, 4.5);

      controls = new THREE.OrbitControls(camera, renderer.domElement);
      controls.target.set(0, 0.15, 0);
      controls.enableDamping = true;
      controls.dampingFactor = 0.08;
      controls.enablePan = false;
      controls.minDistance = 2.6;
      controls.maxDistance = 8;
      controls.minPolarAngle = 0.12;
      controls.maxPolarAngle = 1.48;
      controls.addEventListener("start", function () {
        if (controls.autoRotate) controls.autoRotate = false;
      });

      buildLights();
      buildCake();
      buildHeartField();

      window.addEventListener("resize", onResize);
      document.addEventListener("visibilitychange", onVisibility);
      if (reduced) controls.update();

      cakeGroup.scale.setScalar(0.01);
      cakeGroup.visible = false;
      groundGroup.visible = false;
      renderer.render(scene, camera);
      renderer.setAnimationLoop(animate);

      wireUI();
      window.__cakeReady = true;
      document.body.classList.add("ready", "intro");
      prepareStart();
    }

    function isMobile() {
      return /Android|iPhone|iPad|iPod/i.test(navigator.userAgent) || window.innerWidth < 640;
    }

    /* ============ 灯光：主光定形体，补光保暗部，轮廓光剥主体 ============ */
    function buildLights() {
      var hemi = new THREE.HemisphereLight(0xFFF2F6, 0xFFF9EF, 0.7);
      scene.add(hemi);

      var key = new THREE.DirectionalLight(0xFFF1E2, 1.32);
      key.position.set(3.6, 5.2, 4.2);
      key.castShadow = true;
      key.shadow.mapSize.set(1024, 1024);
      key.shadow.camera.near = 0.5;
      key.shadow.camera.far = 14;
      key.shadow.camera.left = -3.4;
      key.shadow.camera.right = 3.4;
      key.shadow.camera.top = 3.4;
      key.shadow.camera.bottom = -3.4;
      key.shadow.bias = -0.0006;
      key.shadow.radius = 4;
      scene.add(key);

      var rim = new THREE.DirectionalLight(0xFFE0EB, 0.55);
      rim.position.set(-4.2, 2.6, -4.2);
      scene.add(rim);

      var front = new THREE.DirectionalLight(0xFFFFFF, 0.36);
      front.position.set(0.6, 1.4, 5.2);
      scene.add(front);
    }

    /* ============ 蛋糕建模（奶油蛋糕 + 奶油裱花 + 裱字「平安喜樂」+ 花瓣 + 爱心饰带 + 蝴蝶结） ============ */
    function buildCake() {
      cakeGroup = new THREE.Group();
      var matCream = new THREE.MeshPhysicalMaterial({
        color: 0xFFF0E8, roughness: 0.36, clearcoat: 0.28, clearcoatRoughness: 0.5
      });
      var matPink = new THREE.MeshStandardMaterial({ color: 0xFF9DB8, roughness: 0.42 });
      var matPlate = new THREE.MeshPhysicalMaterial({
        color: 0xFFFFFF, roughness: 0.12, clearcoat: 1, clearcoatRoughness: 0.05
      });

      /* 白瓷盘（外扩弧沿） */
      var plate = new THREE.Mesh(new THREE.CylinderGeometry(1.74, 1.9, 0.16, 96), matPlate);
      plate.position.y = 0.08;
      plate.receiveShadow = true;
      cakeGroup.add(plate);
      var plateRim = new THREE.Mesh(new THREE.TorusGeometry(1.82, 0.05, 24, 96), matPlate);
      plateRim.rotation.x = Math.PI / 2;
      plateRim.position.y = 0.16;
      cakeGroup.add(plateRim);

      /* 蛋糕主体（上窄下宽、圆润） */
      var body = new THREE.Mesh(new THREE.CylinderGeometry(1.18, 1.34, 1.16, 96, 1, false), matCream);
      body.position.y = 0.15 + 0.58;
      body.castShadow = true;
      body.receiveShadow = true;
      cakeGroup.add(body);

      /* 顶面奶油圆顶（浅弧面） */
      var dome = new THREE.Mesh(new THREE.SphereGeometry(1.2, 64, 32, 0, Math.PI * 2, 0, Math.PI / 2), matCream);
      dome.scale.set(1, 0.1, 1);
      dome.position.y = topY;
      dome.receiveShadow = true;
      cakeGroup.add(dome);

      /* 粉色波浪淋面（参考 OIP-C：顶部 + 底部一圈波浪裱花） */
      var matWavy = new THREE.MeshPhysicalMaterial({ color: 0xFF7FAB, roughness: 0.3, clearcoat: 0.55, clearcoatRoughness: 0.25 });
      wavyIcing(1.14, topY + 0.03, 7, 0.05, 0.05, 0.1, matWavy);
      wavyIcing(1.31, 0.15 + 0.28, 7, 0.045, 0.04, 0.085, matWavy);

      /* 底部粉色缎带（参考 OIP-C：底边一圈实心粉带） */
      var ribbon = new THREE.Mesh(new THREE.CylinderGeometry(1.315, 1.33, 0.16, 64, 1, true), new THREE.MeshStandardMaterial({ color: 0xFF7FA5, roughness: 0.42 }));
      ribbon.position.y = 0.15 + 0.1;
      cakeGroup.add(ribbon);

      /* 中部爱心饰带（参考 OIP-C：带小爱心图案的粉色饰带） */
      var bandMat = new THREE.MeshStandardMaterial({ map: makeBandTexture(), roughness: 0.45 });
      var band = new THREE.Mesh(new THREE.CylinderGeometry(1.26, 1.29, 0.22, 64, 1, true), bandMat);
      band.position.y = 0.15 + 0.52;
      cakeGroup.add(band);

      /* 底部两侧蝴蝶结（参考 OIP-C：带飘带，位于缎带两侧） */
      var bowL = makeBow(0xFF7FA5);
      bowL.position.set(-1.26, 0.42, 0.66);
      bowL.rotation.y = 0.55;
      cakeGroup.add(bowL);
      var bowR = makeBow(0xFF8FB1);
      bowR.position.set(1.26, 0.42, 0.66);
      bowR.rotation.y = -0.55;
      cakeGroup.add(bowR);

      /* 「平安喜樂」直立在顶面右前方（面向镜头，透明底只显字） */
      var txtTex = makeTextTexture();
      var textPlane = new THREE.Mesh(
        new THREE.PlaneGeometry(1.18, 0.74),
        new THREE.MeshStandardMaterial({
          map: txtTex, transparent: true, roughness: 0.35, depthWrite: false, side: THREE.DoubleSide,
          emissive: 0xFFFFFF, emissiveMap: txtTex, emissiveIntensity: 0.3
        })
      );
      textPlane.position.set(0.62, topY + 0.47, 0.42);
      textPlane.rotation.x = -0.12;
      textPlane.rotation.y = 0.2;
      cakeGroup.add(textPlane);

      /* 奶油花瓣：顶沿一周向外 + 顶部散落（避开文字区） */
      buildPetals();

      /* 顶部直立大爱心（参考 OIP-C：高光粉色立体爱心，立于顶面中央） */
      var bigHeart = heartMesh(0xFF5E96, true);
      bigHeart.scale.setScalar(0.62);
      bigHeart.position.set(-0.12, topY + 0.36, -0.26);
      cakeGroup.add(bigHeart);
      heartFloats.push({ m: bigHeart, base: bigHeart.position.y, amp: 0.006, ph: 0 });

      var heartPos = [[-0.62, 0.34], [-0.88, -0.06], [-0.5, -0.7], [0.16, -0.92], [0.62, -0.6], [-0.22, 0.72]];
      for (var hi = 0; hi < heartPos.length; hi++) {
        var hx = heartPos[hi][0], hz = heartPos[hi][1];
        var hrad = Math.sqrt(hx * hx + hz * hz);
        var hh = 0.1 * Math.sqrt(Math.max(0, 1 - (hrad * hrad) / 1.44));
        var hm = heartMesh(hi % 2 ? 0xFF8FB1 : 0xFFA0BE);
        hm.scale.setScalar(0.15 + Math.random() * 0.07);
        hm.position.set(hx, topY + hh + 0.05, hz);
        hm.rotation.x = Math.PI / 2 - 0.08;
        hm.rotation.z = Math.random() * Math.PI * 2;
        cakeGroup.add(hm);
        heartFloats.push({ m: hm, base: hm.position.y, amp: 0.006, ph: hi * 1.1 });
      }

      /* 接触阴影盘（独立分组，不参与点击） */
      groundGroup = new THREE.Group();
      var shadowDisc = new THREE.Mesh(
        new THREE.CircleGeometry(1.95, 48),
        new THREE.ShadowMaterial({ opacity: 0.3 })
      );
      shadowDisc.rotation.x = -Math.PI / 2;
      shadowDisc.position.y = 0.003;
      shadowDisc.receiveShadow = true;
      groundGroup.add(shadowDisc);
      scene.add(groundGroup);

      scene.add(cakeGroup);
      cakeGroup.position.y = -0.68;  /* 整体下移，与上方标题留出约 3cm 距离 */
    }

    /* 奶油裱花圆珠：一圈重叠的小圆珠 */
    function pipedRing(radius, y, count, size, mat, rMin, rMax) {
      for (var i = 0; i < count; i++) {
        var a = (i / count) * Math.PI * 2 + 0.05;
        var s = new THREE.Mesh(new THREE.SphereGeometry(size, 22, 16), mat);
        var rr = radius * (rMin + (rMax - rMin) * Math.random());
        s.position.set(Math.cos(a) * rr, y + (Math.random() - 0.5) * 0.012, Math.sin(a) * rr);
        s.scale.set(1, 0.9, 1);
        s.castShadow = true;
        cakeGroup.add(s);
      }
    }

    /* 波浪淋面：沿正弦起伏的闭合曲线做圆管 */
    function wavyIcing(radius, yBase, waves, ampR, ampY, tubeR, mat) {
      var pts = [];
      var N = 140;
      for (var i = 0; i < N; i++) {
        var a = (i / N) * Math.PI * 2;
        var r = radius + ampR * Math.sin(waves * a);
        pts.push(new THREE.Vector3(Math.cos(a) * r, yBase + ampY * Math.cos(waves * a), Math.sin(a) * r));
      }
      var curve = new THREE.CatmullRomCurve3(pts, true);
      var geo = new THREE.TubeGeometry(curve, 280, tubeR, 18, true);
      var m = new THREE.Mesh(geo, mat);
      m.castShadow = true;
      m.receiveShadow = true;
      cakeGroup.add(m);
      return m;
    }

    /* 爱心饰带纹理 */
    function makeBandTexture() {
      var c = document.createElement("canvas");
      c.width = 1024; c.height = 256;
      var g = c.getContext("2d");
      g.fillStyle = "#FFF8F2";
      g.fillRect(0, 0, 1024, 256);
      g.fillStyle = "#FFD9E6";
      g.fillRect(0, 0, 1024, 14);
      g.fillRect(0, 242, 1024, 14);
      for (var i = 0; i < 8; i++) {
        g.fillStyle = i % 2 ? "#FF8FAD" : "#FF6F9C";
        bandHeart(g, 64 + i * 128, 128, 46);
      }
      var tex = new THREE.CanvasTexture(c);
      tex.anisotropy = 4;
      return tex;
    }
    function bandHeart(g, x, y, s) {
      g.beginPath();
      g.moveTo(x, y + s * 0.3);
      g.bezierCurveTo(x - s * 0.62, y - s * 0.1, x - s * 0.36, y - s * 0.52, x, y - s * 0.18);
      g.bezierCurveTo(x + s * 0.36, y - s * 0.52, x + s * 0.62, y - s * 0.1, x, y + s * 0.3);
      g.closePath();
      g.fill();
    }

    /* 蝴蝶结 */
    function makeBow(color) {
      var g = new THREE.Group();
      var mat = new THREE.MeshStandardMaterial({ color: color, roughness: 0.42, side: THREE.DoubleSide });
      var l1 = new THREE.Mesh(new THREE.BoxGeometry(0.36, 0.08, 0.16), mat);
      l1.position.set(-0.13, 0.02, 0);
      l1.rotation.z = -0.5;
      var l2 = new THREE.Mesh(new THREE.BoxGeometry(0.36, 0.08, 0.16), mat);
      l2.position.set(0.13, 0.02, 0);
      l2.rotation.z = 0.5;
      var knot = new THREE.Mesh(new THREE.SphereGeometry(0.065, 16, 12), mat);
      knot.position.y = 0.02;
      var t1 = new THREE.Mesh(new THREE.BoxGeometry(0.09, 0.3, 0.02), mat);
      t1.position.set(-0.05, -0.15, -0.02);
      t1.rotation.z = 0.12;
      var t2 = new THREE.Mesh(new THREE.BoxGeometry(0.09, 0.26, 0.02), mat);
      t2.position.set(0.06, -0.13, -0.03);
      t2.rotation.z = -0.1;
      g.add(l1, l2, knot, t1, t2);
      g.scale.setScalar(1.15);
      return g;
    }

    /* 立体爱心（参考 OIP-C：奶油爱心，躺卧在顶面） */
    function makeHeartShape() {
      var s = new THREE.Shape();
      s.moveTo(0, 0.28);
      s.bezierCurveTo(-0.08, 0.52, -0.42, 0.55, -0.5, 0.28);
      s.bezierCurveTo(-0.58, -0.02, -0.28, -0.28, 0, -0.58);
      s.bezierCurveTo(0.28, -0.28, 0.58, -0.02, 0.5, 0.28);
      s.bezierCurveTo(0.42, 0.55, 0.08, 0.52, 0, 0.28);
      return s;
    }
    function heartMesh(color, glossy) {
      var geo = new THREE.ExtrudeGeometry(makeHeartShape(), {
        depth: 0.18, bevelEnabled: true, bevelSize: 0.06, bevelThickness: 0.06,
        bevelSegments: 3, curveSegments: 16
      });
      var mat = glossy
        ? new THREE.MeshPhysicalMaterial({ color: color, roughness: 0.22, clearcoat: 0.9, clearcoatRoughness: 0.15 })
        : new THREE.MeshStandardMaterial({ color: color, roughness: 0.4 });
      var m = new THREE.Mesh(geo, mat);
      m.castShadow = true;
      return m;
    }

    /* 「平安喜樂」奶油裱字纹理（透明底，2×2，浮雕：投影 + 描边 + 高光） */
    function makeTextTexture() {
      var c = document.createElement("canvas");
      c.width = 1024; c.height = 640;
      var g = c.getContext("2d");
      g.clearRect(0, 0, 1024, 640);
      g.textAlign = "center";
      g.textBaseline = "middle";
      g.lineJoin = "round";
      var font = '350px "KaiTi", "STKaiti", "楷体", "AR PL UKai CN", serif';
      var chars = [["平", "安"], ["喜", "樂"]];
      for (var row = 0; row < 2; row++) {
        for (var col = 0; col < 2; col++) {
          var x = 256 + col * 512, y = 160 + row * 320;
          g.font = font;
          /* 奶油浮雕：深色投影（下移）→ 白描边 → 深玫红渐变主体（比蛋糕底色更深更清晰） → 高光 */
          g.fillStyle = "rgba(138, 36, 66, 0.55)";
          g.fillText(chars[row][col], x, y + 16);
          g.lineWidth = 30; g.strokeStyle = "#FFFDF8";
          g.strokeText(chars[row][col], x, y);
          g.lineWidth = 13; g.strokeStyle = "#FFCFDD";
          g.strokeText(chars[row][col], x, y);
          var grd = g.createLinearGradient(x - 140, y - 180, x + 140, y + 180);
          grd.addColorStop(0, "#E25488");
          grd.addColorStop(0.5, "#CE477A");
          grd.addColorStop(1, "#B8336B");
          g.fillStyle = grd;
          g.fillText(chars[row][col], x, y);
          g.fillStyle = "rgba(255, 255, 255, 0.8)";
          g.fillText(chars[row][col], x - 9, y - 10);
        }
      }
      var tex = new THREE.CanvasTexture(c);
      tex.anisotropy = 4;
      return tex;
    }

    /* 奶油花瓣 */
    function buildPetals() {
      var petalGeo = makePetalGeometry();
      var petalMats = [0xFFA6C2, 0xFFB8CE, 0xFFC9DB].map(function (c) {
        return new THREE.MeshStandardMaterial({ color: c, roughness: 0.5 });
      });
      for (var p = 0; p < 14; p++) {
        var pa = (p / 14) * Math.PI * 2 + 0.12;
        var pm = new THREE.Mesh(petalGeo, petalMats[p % 3]);
        var rr = 0.98 + Math.random() * 0.1;
        var dh = 0.1 * Math.sqrt(Math.max(0, 1 - (rr * rr) / 1.44));
        pm.scale.set(0.85 + Math.random() * 0.25, 0.85 + Math.random() * 0.25, 1);
        pm.position.set(Math.cos(pa) * rr, topY + dh + 0.02, Math.sin(pa) * rr);
        pm.rotation.x = -Math.PI / 2 + 0.12;
        pm.rotation.z = pa;
        pm.castShadow = true;
        cakeGroup.add(pm);
      }
      var scatter = [[-0.55, 0.45], [-0.2, 0.62], [-0.35, 0.8], [0.18, 0.74], [0.38, 0.88]];
      for (var s2 = 0; s2 < scatter.length; s2++) {
        var sx = scatter[s2][0], sz = scatter[s2][1];
        var sr = Math.sqrt(sx * sx + sz * sz);
        var sh = 0.1 * Math.sqrt(Math.max(0, 1 - (sr * sr) / 1.44));
        var pm2 = new THREE.Mesh(petalGeo, petalMats[s2 % 3]);
        pm2.scale.set(0.7 + Math.random() * 0.3, 0.7 + Math.random() * 0.3, 1);
        pm2.position.set(sx, topY + sh + 0.02, sz);
        pm2.rotation.x = -Math.PI / 2;
        pm2.rotation.z = Math.random() * Math.PI;
        cakeGroup.add(pm2);
      }
    }
    function makePetalGeometry() {
      var s = new THREE.Shape();
      s.moveTo(0, -0.2);
      s.quadraticCurveTo(0.2, -0.02, 0, 0.18);
      s.quadraticCurveTo(-0.2, -0.02, 0, -0.2);
      return new THREE.ExtrudeGeometry(s, {
        depth: 0.015, bevelEnabled: true, bevelSize: 0.008, bevelThickness: 0.015, bevelSegments: 2, curveSegments: 10
      });
    }

    /* ============ 蜡烛 ============ */
    function makeCandle() {
      var g = new THREE.Group();
      var bodyMat = new THREE.MeshStandardMaterial({ color: 0xFF8FB1, roughness: 0.5 });
      var body = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.05, 0.42, 16), bodyMat);
      body.position.y = 0.21;
      body.castShadow = true;
      g.add(body);

      var wickMat = new THREE.MeshStandardMaterial({ color: 0x8A5A3A, roughness: 0.9 });
      var wick = new THREE.Mesh(new THREE.CylinderGeometry(0.008, 0.008, 0.05, 6), wickMat);
      wick.position.y = 0.43;
      g.add(wick);

      var fg = new THREE.Group();
      var fOuter = new THREE.Mesh(new THREE.ConeGeometry(0.048, 0.13, 14),
        new THREE.MeshStandardMaterial({ color: 0xFFB84D, emissive: 0xFF9A2E, emissiveIntensity: 0.8, roughness: 0.4 }));
      fOuter.position.y = 0.065;
      var fInner = new THREE.Mesh(new THREE.ConeGeometry(0.026, 0.075, 10),
        new THREE.MeshStandardMaterial({ color: 0xFFF3C4, emissive: 0xFFE8A0, emissiveIntensity: 0.95, roughness: 0.4 }));
      fInner.position.y = 0.08;
      fg.add(fOuter, fInner);

      var glowTex = makeGlowTexture();
      var sprite = new THREE.Sprite(new THREE.SpriteMaterial({
        map: glowTex, blending: THREE.AdditiveBlending, depthWrite: false, transparent: true, opacity: 0.85
      }));
      sprite.scale.set(0.34, 0.34, 1);
      fg.add(sprite);

      fg.position.y = 0.47;
      g.add(fg);

      g.userData = { group: g, flame: fg, bodyMat: bodyMat, out: false, phase: Math.random() * Math.PI * 2 };
      candles.push(g.userData);
      return g;
    }

    function makeGlowTexture() {
      var c = document.createElement("canvas");
      c.width = 128; c.height = 128;
      var g = c.getContext("2d");
      var grad = g.createRadialGradient(64, 64, 4, 64, 64, 62);
      grad.addColorStop(0, "rgba(255, 200, 120, .9)");
      grad.addColorStop(0.4, "rgba(255, 180, 90, .28)");
      grad.addColorStop(1, "rgba(255, 160, 80, 0)");
      g.fillStyle = grad;
      g.fillRect(0, 0, 128, 128);
      var tex = new THREE.CanvasTexture(c);
      return tex;
    }

    function addCandle(x, z) {
      if (candles.length >= MAX_CANDLES) return;
      for (var i = 0; i < candles.length; i++) {
        var p = candles[i].group.position;
        if (Math.hypot(p.x - x, p.z - z) < 0.17) return;
      }
      var c = makeCandle();
      c.position.set(x, topY, z);
      cakeGroup.add(c);
      updateCount();
    }

    function setCandlesOut(out) {
      for (var i = 0; i < candles.length; i++) {
        var cd = candles[i];
        cd.out = out;
        cd.flame.visible = !out;
        cd.bodyMat.color.set(out ? 0xE3C7D2 : 0xFF8FB1);
      }
    }

    function updateCount() {
      document.getElementById("candleCount").textContent = candles.length;
    }

    /* ============ 背景漂浮爱心（DOM，克制） ============ */
    function buildHeartField() {
      var field = document.getElementById("heartField");
      if (reduced) return;
      var palette = ["#F9B8CF", "#FFC7DA", "#F6A7C0", "#FFD3E2", "#F5B7C9"];
      for (var i = 0; i < 14; i++) {
        var h = document.createElement("i");
        h.textContent = "\u2665";
        h.style.left = Math.random() * 100 + "%";
        h.style.fontSize = 12 + Math.random() * 16 + "px";
        h.style.color = palette[i % palette.length];
        h.style.animationDuration = 9 + Math.random() * 12 + "s";
        h.style.animationDelay = (Math.random() * 12) + "s";
        field.appendChild(h);
      }
    }

    /* ============ 开场：轻触开始 → 5 秒倒计时（音效）→ 展示蛋糕 ============ */
    function prepareStart() {
      document.getElementById("loaderTxt").textContent = "轻触开始";
      var loader = document.getElementById("loader");
      loader.addEventListener("click", beginIntro);
      loader.addEventListener("keydown", function (e) {
        if (e.key === "Enter" || e.key === " ") {
          e.preventDefault();
          beginIntro();
        }
      });
      loader.focus({ preventScroll: true });
    }

    function beginIntro() {
      if (introStarted) return;
      introStarted = true;
      document.getElementById("loader").classList.add("gone");
      ensureAudio();
      if (ctx && ctx.state === "suspended") ctx.resume();
      document.body.classList.add("intro");
      startSequence();
    }

    function startSequence() {
      phase = 1;
      document.getElementById("countdown").classList.add("show");
      var nums = [5, 4, 3, 2, 1];
      showNum(nums[0]);
      var i = 0;
      var iv = setInterval(function () {
        i++;
        if (i < nums.length) {
          showNum(nums[i]);
        } else {
          clearInterval(iv);
          finishCountdown();
        }
      }, 1000);
    }

    function showNum(n) {
      playCountTick(n === 1);
      var el = document.getElementById("cdNum");
      el.textContent = n;
      el.classList.remove("pop");
      void el.offsetWidth;
      el.classList.add("pop");
    }

    function finishCountdown() {
      document.getElementById("countdown").classList.remove("show");
      revealCake();
    }

    function revealCake() {
      phase = 3;
      document.body.classList.remove("intro");
      cakeGroup.visible = true;
      groundGroup.visible = true;
      if (!reduced) {
        cakePopStart = clock.elapsedTime;
        controls.autoRotate = true;
        controls.autoRotateSpeed = 1.1;
      } else {
        cakeGroup.scale.setScalar(1);
      }
      document.querySelector(".dock").classList.add("show");
    }

    /* ============ 交互 ============ */
    function wireUI() {
      var raycaster = new THREE.Raycaster();
      var ndc = new THREE.Vector2();

      renderer.domElement.addEventListener("pointerdown", function (e) {
        if (phase !== 3) return;
        var r = renderer.domElement.getBoundingClientRect();
        ndc.x = ((e.clientX - r.left) / r.width) * 2 - 1;
        ndc.y = -((e.clientY - r.top) / r.height) * 2 + 1;
        raycaster.setFromCamera(ndc, camera);
        var hits = raycaster.intersectObjects(cakeGroup.children, true);
        if (!hits.length) return;
        var hp = hits[0].point;
        var x = clampXZ(hp.x), z = clampXZ(hp.z);
        addCandle(x, z);
        if (!reduced) spawnConfetti(hp.x, Math.max(hp.y, topY + 0.12), hp.z);
        if (!songPlayed) { songPlayed = true; playBirthday(); }
        checkIosMute();
      });

      document.getElementById("blowBtn").addEventListener("click", toggleBlow);
      document.getElementById("relightBtn").addEventListener("click", function () {
        setCandlesOut(false);
        if (ctx && ctx.state === "suspended") ctx.resume();
      });
      document.getElementById("musicBtn").addEventListener("click", toggleMusic);
    }

    function clampXZ(v) {
      return Math.max(-1.02, Math.min(1.02, v));
    }

    /* ============ 麦克风吹灭蜡烛 ============ */
    function toggleBlow() {
      if (micActive) {
        stopMic();
        return;
      }
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        toast("当前浏览器不支持麦克风");
        return;
      }
      navigator.mediaDevices.getUserMedia({ audio: true }).then(function (stream) {
        micStream = stream;
        ctx = ctx || createCtx();
        analyser = ctx.createAnalyser();
        analyser.fftSize = 512;
        var src = ctx.createMediaStreamSource(stream);
        src.connect(analyser);
        micActive = true;
        var dot = document.getElementById("blowDot");
        dot.classList.add("on");
        blowIv = setInterval(checkBlow, 150);
      }).catch(function () {
        toast("麦克风授权失败，请允许后重试");
      });
    }

    function stopMic() {
      micActive = false;
      if (micStream) {
        micStream.getTracks().forEach(function (t) { t.stop(); });
        micStream = null;
      }
      if (blowIv) { clearInterval(blowIv); blowIv = null; }
      document.getElementById("blowDot").classList.remove("on");
    }

    function checkBlow() {
      if (!analyser) return;
      var buf = new Uint8Array(analyser.frequencyBinCount);
      analyser.getByteFrequencyData(buf);
      var sum = 0;
      for (var i = 0; i < buf.length; i++) sum += buf[i];
      var avg = sum / buf.length;
      if (avg > 45) {
        setCandlesOut(true);
        var dot = document.getElementById("blowDot");
        dot.classList.remove("on");
        dot.classList.add("blow");
        setTimeout(function () { dot.classList.remove("blow"); }, 420);
      }
    }

    /* ============ 音频：生日歌 / 音乐开关 / iOS 静音提示 ============ */
    function createCtx() {
      var ac = new (window.AudioContext || window.webkitAudioContext)();
      masterGain = ac.createGain();
      masterGain.gain.value = musicOn ? 0.5 : 0.0001;
      var comp = ac.createDynamicsCompressor();
      masterGain.connect(comp);
      comp.connect(ac.destination);
      /* 八音盒梦幻回声总线：音符走这里，带轻柔反馈延迟，余音绵长 */
      musicBus = ac.createGain();
      musicBus.gain.value = 1;
      musicBus.connect(masterGain);
      var echo = ac.createDelay(1.5);
      echo.delayTime.value = 0.36;
      var fb = ac.createGain(); fb.gain.value = 0.34;
      echo.connect(fb); fb.connect(echo);
      var wet = ac.createGain(); wet.gain.value = 0.22;
      echo.connect(wet); wet.connect(masterGain);
      musicBus.connect(echo);
      return ac;
    }
    function ensureAudio() {
      if (!ctx) ctx = createCtx();
      if (ctx.state === "suspended") ctx.resume();
    }

    /* 生日歌·八音盒慢板：缓慢优雅，纯净铃音，余韵悠长 */
    var SONG = [
      [392, 0.75], [392, 0.25], [440, 1], [392, 1], [523.25, 1], [493.88, 2],
      [392, 0.75], [392, 0.25], [440, 1], [392, 1], [587.33, 1], [523.25, 2],
      [392, 0.75], [392, 0.25], [783.99, 1], [659.25, 1], [523.25, 1], [493.88, 1], [440, 2],
      [698.46, 0.75], [698.46, 0.25], [659.25, 1], [523.25, 1], [587.33, 1], [523.25, 2.8]
    ];
    var BEAT = 0.62;   /* 慢板，优雅从容 */

    function bell(freq, at, vol, type) {
      var o = ctx.createOscillator();
      o.type = type || "sine";
      o.frequency.value = freq;
      var g = ctx.createGain();
      /* 八音盒：轻轻触击后自然泛响 ~4 秒，音符在空气中重叠回荡 */
      g.gain.setValueAtTime(0.0001, at);
      g.gain.exponentialRampToValueAtTime(vol, at + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, at + 4.0);
      o.connect(g); g.connect(musicBus);
      o.start(at); o.stop(at + 4.2);
    }

    function scheduleSongOnce() {
      if (!ctx) return;
      var t = ctx.currentTime + 0.2;
      for (var i = 0; i < SONG.length; i++) {
        var f = SONG[i][0], beats = SONG[i][1];
        bell(f, t, 0.22, "sine");             /* 主铃 */
        bell(f * 2, t, 0.07, "sine");         /* 高八度泛音，铃片的金属感 */
        t += beats * BEAT;
      }
    }

    /* 一直循环播放，直到关闭网页；音乐开关关掉时静音但循环继续 */
    var songLoopTimer = null;
    function playBirthday() {
      if (!ctx) return;
      if (ctx.state === "suspended") ctx.resume();
      scheduleSongOnce();
      if (songLoopTimer) return;
      songLoopTimer = setInterval(function () {
        if (!musicOn || !ctx || ctx.state !== "running") return;
        scheduleSongOnce();
      }, 19500);
    }

    /* 倒计时提示音：普通“嘀”与最后一声“叮” */
    function playCountTick(final) {
      if (!ctx) return;
      var t = ctx.currentTime + 0.02;
      var o = ctx.createOscillator();
      var g = ctx.createGain();
      if (final) {
        o.type = "triangle";
        o.frequency.value = 880;
        g.gain.setValueAtTime(0.0001, t);
        g.gain.exponentialRampToValueAtTime(0.32, t + 0.015);
        g.gain.exponentialRampToValueAtTime(0.0001, t + 0.5);
        o.connect(g); g.connect(masterGain);
        o.start(t); o.stop(t + 0.55);
      } else {
        o.type = "square";
        o.frequency.value = 660;
        g.gain.setValueAtTime(0.0001, t);
        g.gain.exponentialRampToValueAtTime(0.22, t + 0.01);
        g.gain.exponentialRampToValueAtTime(0.0001, t + 0.13);
        o.connect(g); g.connect(masterGain);
        o.start(t); o.stop(t + 0.16);
      }
    }

    function toggleMusic() {
      if (!ctx) {
        ctx = createCtx();
        ctx.resume();
      }
      musicOn = !musicOn;
      var target = musicOn ? 0.5 : 0.0001;
      masterGain.gain.cancelScheduledValues(ctx.currentTime);
      masterGain.gain.setTargetAtTime(target, ctx.currentTime, 0.05);
      try { localStorage.setItem("yyMusicOn", musicOn ? "1" : "0"); } catch (e) {}
      var btn = document.getElementById("musicBtn");
      btn.setAttribute("aria-checked", musicOn ? "true" : "false");
      document.getElementById("msLabel").textContent = musicOn ? "音乐开" : "已静音";
    }

    /* iOS 侧边静音键检测 */
    function checkIosMute() {
      if (!(/iPhone|iPad|iPod/i.test(navigator.userAgent)) || !analyser || muteTimer) return;
      muteTimer = setTimeout(function () {
        muteTimer = null;
        var buf = new Uint8Array(analyser.frequencyBinCount);
        analyser.getByteFrequencyData(buf);
        var allZero = true;
        for (var i = 0; i < buf.length; i++) if (buf[i] !== 0) { allZero = false; break; }
        if (allZero) document.getElementById("muteHint").style.display = "block";
      }, 600);
    }

    /* ============ 彩纸粒子（点击蛋糕时的小彩纸） ============ */
    function spawnConfetti(x, y, z) {
      var count = 22;
      var pos = new Float32Array(count * 3);
      var col = new Float32Array(count * 3);
      var vel = new Float32Array(count * 3);
      var pal = [0xFF6F9C, 0xFF9DB8, 0xF5B14C, 0xFFD9E6, 0x7FB77E];
      for (var i = 0; i < count; i++) {
        var a = Math.random() * Math.PI * 2;
        var sp = 1.2 + Math.random() * 1.6;
        vel[i * 3] = Math.cos(a) * sp;
        vel[i * 3 + 1] = 1.4 + Math.random() * 1.8;
        vel[i * 3 + 2] = Math.sin(a) * sp;
        pos[i * 3] = x; pos[i * 3 + 1] = y; pos[i * 3 + 2] = z;
        var cc = pal[i % pal.length];
        col[i * 3] = ((cc >> 16) & 255) / 255;
        col[i * 3 + 1] = ((cc >> 8) & 255) / 255;
        col[i * 3 + 2] = (cc & 255) / 255;
      }
      var geo = new THREE.BufferGeometry();
      geo.setAttribute("position", new THREE.BufferAttribute(pos, 3));
      geo.setAttribute("color", new THREE.BufferAttribute(col, 3));
      var mat = new THREE.PointsMaterial({ size: 0.09, vertexColors: true, transparent: true, opacity: 1, depthWrite: false });
      var pts = new THREE.Points(geo, mat);
      scene.add(pts);
      confettis.push({ pts: pts, geo: geo, mat: mat, pos: pos, vel: vel, count: count, age: 0, ttl: 1.3 });
    }

    /* ============ 动画循环 ============ */
    function animate() {
      if (document.hidden) return;
      var delta = clock.getDelta();
      var t = clock.elapsedTime;

      if (phase === 3 && !reduced) {
        var k = Math.min((t - cakePopStart) / 0.9, 1);
        var ease = 1 - Math.pow(1 - k, 3);
        cakeGroup.scale.setScalar(0.01 + 0.99 * ease);
      }

      /* 火焰跳动 */
      for (var i = 0; i < candles.length; i++) {
        var cd = candles[i];
        if (cd.out) continue;
        cd.flame.position.y = 0.47 + Math.sin(t * 9 + cd.phase) * 0.012;
        cd.flame.scale.set(1 + Math.sin(t * 13 + cd.phase) * 0.08, 1 + Math.cos(t * 11 + cd.phase) * 0.08, 1);
      }

      /* 爱心轻微浮动 */
      for (var hf = 0; hf < heartFloats.length; hf++) {
        var h = heartFloats[hf];
        h.m.position.y = h.base + Math.sin(t * 1.5 + h.ph) * h.amp;
      }

      /* 彩纸粒子 */
      for (var f = confettis.length - 1; f >= 0; f--) {
        var b = confettis[f];
        b.age += delta;
        var arr = b.pos, v = b.vel;
        for (var q = 0; q < b.count; q++) {
          v[q * 3 + 1] -= 0.9 * delta;
          arr[q * 3] += v[q * 3] * delta;
          arr[q * 3 + 1] += v[q * 3 + 1] * delta;
          arr[q * 3 + 2] += v[q * 3 + 2] * delta;
        }
        b.geo.attributes.position.needsUpdate = true;
        b.mat.opacity = Math.max(0, 1 - b.age / b.ttl);
        if (b.age >= b.ttl) {
          scene.remove(b.pts);
          b.geo.dispose();
          b.mat.dispose();
          confettis.splice(f, 1);
        }
      }

      controls.update();
      renderer.render(scene, camera);
    }

    function onResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    function onVisibility() {
      if (document.hidden) {
        renderer.setAnimationLoop(null);
      } else {
        clock.getDelta();
        renderer.setAnimationLoop(animate);
      }
    }

    /* ============ 轻量 toast（麦克风等提示） ============ */
    var toastEl = null;
    function toast(msg) {
      if (!toastEl) {
        toastEl = document.createElement("div");
        toastEl.style.cssText = "position:fixed;left:50%;top:16%;transform:translateX(-50%);z-index:30;" +
          "background:rgba(90,46,67,.92);color:#fff;font-size:14px;padding:10px 18px;border-radius:12px;" +
          "box-shadow:0 8px 24px rgba(0,0,0,.18);transition:opacity .3s ease;";
        document.body.appendChild(toastEl);
      }
      toastEl.textContent = msg;
      toastEl.style.opacity = "1";
      clearTimeout(toastEl._t);
      toastEl._t = setTimeout(function () { toastEl.style.opacity = "0"; }, 2400);
    }

    /* 音乐开关记忆 */
    try {
      var saved = localStorage.getItem("yyMusicOn");
      if (saved === "0") {
        musicOn = false;
        document.getElementById("msLabel").textContent = "已静音";
        document.getElementById("musicBtn").setAttribute("aria-checked", "false");
      }
    } catch (e) {}

    var DEP_GROUPS = [
      [
        "https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js",
        "https://cdnjs.cloudflare.com/ajax/libs/three.js/0.147.0/three.min.js"
      ],
      [
        "https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/controls/OrbitControls.js",
        "https://unpkg.com/three@0.147.0/examples/js/controls/OrbitControls.js"
      ]
    ];

    function loadSeq(urls, done) {
      if (!urls.length) { done(); return; }
      var s = document.createElement("script");
      s.src = urls[0];
      s.onload = function () { done(); };
      s.onerror = function () { s.remove(); loadSeq(urls.slice(1), done); };
      document.head.appendChild(s);
    }

    (function boot() {
      function loadNext(i) {
        if (i >= DEP_GROUPS.length) { init(); return; }
        loadSeq(DEP_GROUPS[i], function () { loadNext(i + 1); });
      }
      loadNext(0);
    })();
  })();
  </script>
</body>
</html>
